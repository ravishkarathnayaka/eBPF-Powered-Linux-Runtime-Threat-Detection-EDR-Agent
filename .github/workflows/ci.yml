name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-validate:
    name: Code Linting & Syntax Validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 yamllint clang-format

      - name: Run Black Code Formatter Check
        run: |
          black --check agent/ tests/

      - name: Run Flake8 Linter
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 agent/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 agent/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Validate YAML Detection Rules
        run: |
          yamllint -d relaxed rules/

  unit-tests:
    name: Unit Tests & Code Coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pytest Suite
        run: |
          pytest --cov=agent --cov-report=xml --cov-report=term tests/

      - name: Test Agent Synthetic Dry-Run Mode
        run: |
          python -m agent.main --dry-run
