# ==============================================================================
# Detection Rule: Interactive Reverse Shell Execution
# ==============================================================================
id: RULE-EDR-001
title: Interactive Reverse Shell Execution
description: Detects interactive shell execution with socket redirects or reverse shell command patterns.
severity: CRITICAL
event_type:
  - EXECVE
  - CONNECT

mitre_attack:
  tactic_id: TA0002
  tactic_name: Execution
  technique_id: T1059.004
  technique_name: "Command and Scripting Interpreter: Unix Shell"

condition:
  or:
    # 1. Shell with /dev/tcp or /dev/udp redirection
    - and:
        - field: comm
          in: ["bash", "sh", "zsh", "dash", "ksh"]
        - field: cmdline
          regex_match: "/dev/(tcp|udp)/[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}/[0-9]+"

    # 2. Interactive shell flag combined with redirection
    - and:
        - field: comm
          in: ["bash", "sh", "zsh", "dash", "ash"]
        - field: cmdline
          regex_match: "(-i|--interactive).*(&>|>&|>.*<)"

    # 3. Netcat / Socat reverse shell command execution
    - and:
        - field: comm
          in: ["nc", "netcat", "ncat", "socat"]
        - field: cmdline
          regex_match: "(-e\\s+|exec:).*?(sh|bash|dash|zsh)"

    # 4. Scripting language one-liner reverse shells
    - and:
        - field: comm
          in: ["python", "python3", "perl", "ruby", "lua", "php"]
        - field: cmdline
          regex_match: "(socket\\.socket|pty\\.spawn|IO::Socket|exec.*bin/sh)"
